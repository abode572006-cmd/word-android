name: Check WordCraft desktop UI for Android

on:
  workflow_dispatch:
  push:
    branches: [wordcraft-desktop-android-port]
    paths:
      - ".github/workflows/wordcraft-android-check.yml"

permissions:
  contents: read

jobs:
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Android port workspace
        uses: actions/checkout@v4

      - name: Check out upstream WordCraft source
        uses: actions/checkout@v4
        with:
          repository: storytold/wordcraft
          path: upstream-wordcraft
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;29.0.14206865"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # First verify that the existing document engine and desktop egui UI compile
      # for Android. APK packaging follows only after platform compatibility is known.
      - name: Cross-compile WordCraft UI and document engine
        working-directory: upstream-wordcraft
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cargo ndk -t arm64-v8a check --package wordcraft-ui-egui

      # Check the real desktop binary too before adding Android activity and APK packaging.
      - name: Check complete WordCraft application for Android
        working-directory: upstream-wordcraft
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          cargo ndk -t arm64-v8a check --package wordcraft
