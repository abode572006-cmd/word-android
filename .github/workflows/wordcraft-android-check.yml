name: Build native WordCraft Android APK

on:
  workflow_dispatch:
  push:
    branches: [wordcraft-desktop-android-port]
    paths:
      - ".github/workflows/wordcraft-android-check.yml"
      - "patches/0002-arabic-localization.patch"
      - "patches/arabic-catalog.tsv"
      - "apps/wordcraft-android/**"
      - "patches/0001-wordcraft-android-port.patch"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Android port workspace
        uses: actions/checkout@v4

      - name: Check out pinned upstream WordCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/wordcraft
          ref: 2ffba93b5189410a415970be179dcf481092d756
          path: upstream-wordcraft
          persist-credentials: false

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Assemble Android shell against pinned upstream
        run: |
          git -C upstream-wordcraft apply --check ../patches/0001-wordcraft-android-port.patch
          git -C upstream-wordcraft apply ../patches/0001-wordcraft-android-port.patch
          git -C upstream-wordcraft apply --check ../patches/0002-arabic-localization.patch
          git -C upstream-wordcraft apply ../patches/0002-arabic-localization.patch
          cp patches/arabic-catalog.tsv upstream-wordcraft/crates/ui-egui/src/i18n/ar.tsv
          cp -R apps/wordcraft-android upstream-wordcraft/apps/

      - name: Cross-compile Android shell
        working-directory: upstream-wordcraft
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android26-clang
          export CC_aarch64_linux_android=aarch64-linux-android26-clang
          export CXX_aarch64_linux_android=aarch64-linux-android26-clang++
          export AR_aarch64_linux_android=llvm-ar
          cargo check -p wordcraft-android --target aarch64-linux-android

      - name: Run Android shell unit tests on host
        working-directory: upstream-wordcraft
        run: cargo test -p wordcraft-android

      - name: Create temporary signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/wordcraft-test.jks" -alias wordcraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=WordCraft CI, O=Local Test, C=US"

      - name: Build signed arm64 APK
        working-directory: upstream-wordcraft
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/wordcraft-test.jks
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android26-clang
          export CC_aarch64_linux_android=aarch64-linux-android26-clang
          export CXX_aarch64_linux_android=aarch64-linux-android26-clang++
          export AR_aarch64_linux_android=llvm-ar
          cargo apk build --release -p wordcraft-android

      - name: Verify APK package and signature
        working-directory: upstream-wordcraft
        run: |
          APK="$(find target/release/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | grep -E "package: name='ai.storyteller.wordcraft'|native-code: 'arm64-v8a'"
          mkdir -p ../artifacts
          cp "$APK" ../artifacts/wordcraft-android-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-arm64
          path: artifacts/wordcraft-android-arm64.apk
          if-no-files-found: error
