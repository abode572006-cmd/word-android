name: WordCraft Android development checks

on:
  workflow_dispatch:
  push:
    branches: [wordcraft-desktop-android-port]
    paths:
      - ".github/workflows/wordcraft-android-check.yml"
      - "patches/0002-arabic-localization.patch"
      - "patches/0003-arabic-interface-bidi.patch"
      - "patches/arabic-catalog.tsv"
      - "apps/wordcraft-android/**"
      - "patches/0001-wordcraft-android-port.patch"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Android port workspace
        uses: actions/checkout@v4

      - name: Check out pinned upstream WordCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/wordcraft
          ref: 2ffba93b5189410a415970be179dcf481092d756
          path: upstream-wordcraft
          persist-credentials: false

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Assemble Android shell against pinned upstream
        run: |
          git -C upstream-wordcraft apply --check ../patches/0001-wordcraft-android-port.patch
          git -C upstream-wordcraft apply ../patches/0001-wordcraft-android-port.patch
          git -C upstream-wordcraft apply --check ../patches/0002-arabic-localization.patch
          git -C upstream-wordcraft apply ../patches/0002-arabic-localization.patch
          git -C upstream-wordcraft apply --check ../patches/0003-arabic-interface-bidi.patch
          git -C upstream-wordcraft apply ../patches/0003-arabic-interface-bidi.patch
          cp patches/arabic-catalog.tsv upstream-wordcraft/crates/ui-egui/src/i18n/ar.tsv
          cp -R apps/wordcraft-android upstream-wordcraft/apps/
          test -f apps/wordcraft-android/res/values/styles.xml
          # cargo-apk reads the resource directory from package.metadata.android.resources.
          # Keep the check beside the Android package so aapt receives the exact resource tree.
          test -f apps/wordcraft-android/res/values/styles.xml
          grep -F 'style name="WordcraftFullscreen"' apps/wordcraft-android/res/values/styles.xml
          grep -F 'resources = "res"' apps/wordcraft-android/Cargo.toml
          grep -F 'theme = "@style/WordcraftFullscreen"' apps/wordcraft-android/Cargo.toml
          python3 - <<'PY'
          from pathlib import Path

          def entries(path):
              rows = []
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  if not line.strip() or line.startswith("#"):
                      continue
                  cols = line.split("\t")
                  assert len(cols) == 3, f"malformed TSV row in {path}: {line!r}"
                  rows.append(cols)
              return rows

          source = entries("upstream-wordcraft/crates/ui-egui/src/i18n/zh-hans.tsv")
          arabic = entries("upstream-wordcraft/crates/ui-egui/src/i18n/ar.tsv")
          source_keys = {(row[0], row[1]) for row in source}
          arabic_keys = {(row[0], row[1]) for row in arabic}
          assert len(source) == len(source_keys) == 1729
          assert len(arabic) == len(arabic_keys) == 1729
          assert source_keys == arabic_keys, "Arabic catalog keys differ from the pinned upstream catalog"
          translated = sum(row[1] != row[2] for row in arabic)
          assert translated == 1713, f"expected 1713 translated entries, got {translated}"
          print(f"Arabic catalog verified: {len(arabic)} exact keys, {translated} translated")
          PY

      - name: Cross-compile Android shell
        working-directory: upstream-wordcraft
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android26-clang
          export CC_aarch64_linux_android=aarch64-linux-android26-clang
          export CXX_aarch64_linux_android=aarch64-linux-android26-clang++
          export AR_aarch64_linux_android=llvm-ar
          cargo check -p wordcraft-android --target aarch64-linux-android

      - name: Run document, format, UI, and Arabic regression suites
        working-directory: upstream-wordcraft
        run: |
          cargo test -p wordcraft-doc -p wordcraft-layout -p wordcraft-docx -p wordcraft-formats -p wordcraft-engine -p wordcraft-ui-egui -p wordcraft

      - name: Run Android shell unit tests on host
        working-directory: upstream-wordcraft
        run: cargo test -p wordcraft-android

      # APK packaging is intentionally deferred until the Android feature set passes
      # the functional and device-validation milestones. This workflow is test-only.

