<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Word Android</title>
<style>
:root{--blue:#185abd;--line:#d8dce3;--bg:#f3f4f6}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#222}.top{background:#fff;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:20px;font-weight:bold;color:var(--blue)}.filename{border:0;font-size:16px;min-width:130px;flex:1;padding:8px}.tabs{display:flex;overflow:auto;background:#fff;border-bottom:1px solid var(--line);gap:4px;padding:0 10px}.tab{padding:13px 15px;border:0;background:white;font-size:14px;white-space:nowrap}.tab.active{color:var(--blue);border-bottom:3px solid var(--blue);font-weight:bold}.ribbon{background:#fff;padding:10px;display:flex;gap:7px;overflow:auto;border-bottom:1px solid var(--line)}button,.filebtn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:9px 12px;font-size:14px;white-space:nowrap}.ribbon button:active{background:#e8f0fe}.workspace{padding:18px 8px;overflow:auto}.page{background:#fff;width:min(100%,794px);min-height:1050px;margin:auto;padding:65px 55px;box-shadow:0 2px 12px #0002;direction:rtl;outline:none;font-size:17px;line-height:1.9}.hint{text-align:center;color:#777;font-size:12px;padding:10px}@media(min-width:700px){.workspace{padding:28px}.page{padding:80px 90px}}
</style></head>
<body>
<header class="top"><div class="brand">W Word</div><input class="filename" id="filename" value="مستند جديد" aria-label="اسم المستند"><button onclick="saveText()">حفظ النص</button><button onclick="document.getElementById('openfile').click()">فتح ملف نصي</button><input id="openfile" type="file" accept=".txt,.html" hidden onchange="openText(event)"></header>
<nav class="tabs"><button class="tab active">الصفحة الرئيسية</button><button class="tab">إدراج</button><button class="tab">تخطيط</button><button class="tab">مراجعة</button><button class="tab">عرض</button></nav>
<section class="ribbon">
<button onclick="cmd('bold')"><b>غامق B</b></button><button onclick="cmd('italic')"><i>مائل I</i></button><button onclick="cmd('underline')"><u>تحته خط</u></button><button onclick="cmd('justifyRight')">محاذاة يمين</button><button onclick="cmd('justifyCenter')">توسيط</button><button onclick="cmd('insertUnorderedList')">تعداد نقطي</button><button onclick="cmd('insertOrderedList')">تعداد رقمي</button><select onchange="cmd('fontSize',this.value)"><option value="3">حجم عادي</option><option value="4">16</option><option value="5">18</option><option value="6">24</option><option value="7">32</option></select><button onclick="addHeading()">عنوان</button>
</section>
<div class="workspace"><main id="editor" class="page" contenteditable="true" spellcheck="true"><h2>مستند جديد</h2><p>ابدأ الكتابة هنا...</p></main></div>
<div class="hint">نسخة أولية قيد التطوير — تحرير النصوص وحفظها محلياً</div>
<script>
function cmd(c,v=null){document.execCommand(c,false,v);document.getElementById('editor').focus()}
function addHeading(){cmd('formatBlock','h2')}
function saveText(){let blob=new Blob([document.getElementById('editor').innerText],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(document.getElementById('filename').value||'document')+'.txt';a.click();URL.revokeObjectURL(a.href)}
function openText(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>document.getElementById('editor').innerText=r.result;r.readAsText(f)}
</script></body></html>
