plugins {
    id "com.android.application"
}

android {
    namespace "ai.storyteller.wordcraft"
    compileSdk 35

    defaultConfig {
        applicationId "ai.storyteller.wordcraft"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.5.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Kotlin 1.8+ folds the legacy jdk7/jdk8 extension classes into kotlin-stdlib.
// Older AndroidX transitive dependencies can still request the split 1.6.x artifacts;
// exclude those obsolete jars to prevent duplicate classes at D8 time.
configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

dependencies {
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.games:games-activity:4.4.0"
    implementation "androidx.core:core:1.15.0"
    // GameActivity extends AppCompatActivity; declare AppCompat explicitly.
    implementation "androidx.appcompat:appcompat:1.7.0"
}
